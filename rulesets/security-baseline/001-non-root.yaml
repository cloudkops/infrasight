- id: ISG-SEC-001
  title: Container running as root
  severity: HIGH
  category: security
  description: Containers running as root (UID 0) increase blast radius if compromised. Root inside a container can map to root on the host depending on kernel configuration.
  remediation: Set runAsUser to a non-root UID (e.g. 1000) in the pod or container securityContext.
  docs_url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  condition:
    field: container.user
    equals: 0