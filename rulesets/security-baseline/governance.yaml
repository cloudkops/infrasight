- id: ISG-GOV-001
  title: Workload missing required label - team
  severity: LOW
  category: governance
  description: Every workload must be labelled with the owning team for cost attribution, incident routing, and CMDB compliance. A missing team label creates unowned dark workloads.
  remediation: Add metadata.labels.team to the workload manifest and keep it consistent with the team slug in your identity provider.
  docs_url: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  condition:
    field: workload.labels.team
    equals: ""

- id: ISG-GOV-002
  title: Workload missing required label - env
  severity: LOW
  category: governance
  description: Workloads without an env label cannot be automatically separated between production, staging, and development blast-radius policies.
  remediation: Add metadata.labels.env with a value from the approved set (production, staging, development, review).
  docs_url: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  condition:
    field: workload.labels.env
    equals: ""

- id: ISG-GOV-003
  title: Workload missing required label - app
  severity: LOW
  category: governance
  description: Workloads without an app label cannot be accurately correlated in distributed traces, dashboards, or network policies that rely on label selectors.
  remediation: Add metadata.labels.app using the canonical application name from your service registry.
  docs_url: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  condition:
    field: workload.labels.app
    equals: ""

