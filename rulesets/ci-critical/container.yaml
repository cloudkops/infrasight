- id: ISG-CI-001
  title: Privileged container blocks CI promotion
  severity: CRITICAL
  category: security
  description: Privileged containers bypass key kernel isolation and must be blocked from promoting to any environment. Use this rule as a hard CI gate.
  remediation: Remove privileged true and use specific Linux capabilities only when strictly required.
  docs_url: https://kubernetes.io/docs/concepts/security/linux-kernel-security-constraints/
  condition:
    field: container.privileged
    equals: true

- id: ISG-CI-002
  title: Public IP exposure blocks CI promotion
  severity: CRITICAL
  category: security
  description: Any manifest that introduces a direct public IP binding must fail CI. Unreviewed internet exposure is a critical risk and must not ship without explicit security sign-off.
  remediation: Replace LoadBalancer with ClusterIP. Use a managed Ingress with TLS and WAF for external access.
  docs_url: https://kubernetes.io/docs/concepts/services-networking/ingress/
  condition:
    field: container.exposure.publicIP
    equals: true

- id: ISG-CI-003
  title: Host network access blocks CI promotion
  severity: CRITICAL
  category: security
  description: hostNetwork exposes node-level network interfaces and bypasses all CNI policies. It is a critical misconfig that must block pipeline promotion.
  remediation: Remove hostNetwork. Use CNI-managed pod networking and service discovery for inter-workload communication.
  docs_url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
  condition:
    field: container.exposure.hostNetwork
    equals: true

- id: ISG-CI-004
  title: Missing memory limit blocks CI promotion
  severity: CRITICAL
  category: reliability
  description: Deploying a container without a memory limit in CI is a reliability gate violation. Unbounded memory is a runaway-process risk that cannot reach production.
  remediation: Add resources.limits.memory to the container spec before merging.
  docs_url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  condition:
    field: container.resources.memory_limit
    exists: false

