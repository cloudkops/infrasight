- id: ISG-STR-RES-001
  title: Missing CPU limit - strict runtime violation
  severity: HIGH
  category: reliability
  description: In strict runtime environments every container must declare a CPU limit. Unlimited CPU leads to resource contention, latency spikes, and breaches SLA obligations.
  remediation: Set resources.limits.cpu based on load-tested peak usage. Align with VPA recommendations where available.
  docs_url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  condition:
    field: container.resources.cpu_limit
    exists: false

- id: ISG-STR-RES-002
  title: Missing memory limit - strict runtime violation
  severity: HIGH
  category: reliability
  description: Containers without memory limits can trigger OOMKill on co-located workloads and degrade cluster stability. This is a mandatory control in strict runtime profiles.
  remediation: Set resources.limits.memory using peak observed memory plus a 20% buffer. Enable VPA to assist tuning.
  docs_url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  condition:
    field: container.resources.memory_limit
    exists: false

- id: ISG-STR-RES-003
  title: Missing CPU request - strict runtime violation
  severity: MEDIUM
  category: reliability
  description: CPU requests are required for accurate scheduling decisions and fair node utilisation in strict runtime clusters.
  remediation: Set resources.requests.cpu to the observed baseline CPU consumption. Avoid setting this to zero.
  docs_url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  condition:
    field: container.resources.cpu_request
    exists: false

- id: ISG-STR-RES-004
  title: Missing memory request - strict runtime violation
  severity: MEDIUM
  category: reliability
  description: Memory requests are mandatory for reliable scheduling. Without them workloads may be placed on nodes without sufficient headroom and get evicted under pressure.
  remediation: Set resources.requests.memory to the observed baseline memory footprint. Align with VPA suggestions.
  docs_url: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  condition:
    field: container.resources.memory_request
    exists: false

