- id: ISG-STR-001
  title: Container must not run as root
  severity: HIGH
  category: security
  description: Running as UID 0 increases blast radius and weakens tenant isolation in shared clusters. Strict runtime workloads must always define a non-root user.
  remediation: Set runAsNonRoot true and runAsUser to a non-root UID (e.g. 1000) in pod or container securityContext.
  docs_url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  condition:
    field: container.user
    equals: 0

- id: ISG-STR-002
  title: Privileged container forbidden in strict runtime
  severity: CRITICAL
  category: security
  description: Privileged mode grants full host-level capabilities. This is never acceptable for hardened production workloads and must be blocked at admission.
  remediation: Remove privileged true. Use capabilities drop ALL and add back only what is explicitly required.
  docs_url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
  condition:
    field: container.privileged
    equals: true

- id: ISG-STR-003
  title: Host network access forbidden in strict runtime
  severity: CRITICAL
  category: security
  description: hostNetwork bypasses cluster network policies and exposes node-level services to the container. Forbidden for all strict runtime workloads.
  remediation: Disable hostNetwork and use service-to-service communication via ClusterIP or DNS.
  docs_url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
  condition:
    field: container.exposure.hostNetwork
    equals: true

- id: ISG-STR-004
  title: Public IP exposure forbidden in strict runtime
  severity: CRITICAL
  category: security
  description: Direct public IP exposure is the highest-risk network configuration. Strict runtime workloads must never be directly internet-accessible.
  remediation: Remove LoadBalancer services with public IPs. Route external traffic through a managed Ingress with WAF and TLS.
  docs_url: https://kubernetes.io/docs/concepts/services-networking/ingress/
  condition:
    field: container.exposure.publicIP
    equals: true

